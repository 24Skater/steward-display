name: Brand contrast audit

on:
  push:
    branches: [main]
  pull_request:

# Tighten or loosen rules per branch via env vars, or commit a
# contrast.config.json. Resolution order: env > contrast.config.json > AA defaults.
# Examples:
#   CONTRAST_REQUIRE_AAA: "true"        # demand AAA everywhere
#   CONTRAST_BODY: "5.0"                # bump body-text minimum
#   CONTRAST_FAIL_ON_DECORATIVE: "true" # also enforce decorative pairings
#   CONTRAST_CONFIG: ".github/contrast.release.json"

jobs:
  contrast:
    name: WCAG AA contrast check
    runs-on: ubuntu-latest
    env:
      # Default branches stay on WCAG AA. Demand AAA only on release branches.
      CONTRAST_REQUIRE_AAA: ${{ startsWith(github.ref, 'refs/heads/release/') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run brand contrast audit
        id: audit
        run: bun run check:contrast
        # Do NOT stop here on failure — we still want to upload the report
        # and post the summary. The final step re-fails the job.
        continue-on-error: true

      - name: Publish report to job summary
        if: always()
        run: |
          if [ -f reports/contrast.md ]; then
            cat reports/contrast.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload contrast report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-report
          path: reports/
          if-no-files-found: error
          retention-days: 30

      - name: Fail job if audit failed
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::Brand contrast audit failed — see the 'contrast-report' artifact (contrast.html) for details."
          exit 1