name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    name: Platform boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh scripts/ci/check-platform-boundaries.sh

  quality:
    name: Format, lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: steward-display:ci
      - name: Smoke test
        run: |
          docker run -d --name sd -p 3000:3000 steward-display:ci
          ready=""
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000/robots.txt; then ready=1; break; fi
            sleep 1
          done
          test -n "$ready" || { echo "::error::container never became ready"; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/does-not-exist)" = "404"
          # Pages get the header from src/server.ts, static files from nitro routeRules: check both.
          curl -sI http://localhost:3000/ | grep -qi '^x-robots-tag: noindex'
          curl -sI http://localhost:3000/favicon.svg | grep -qi '^x-robots-tag: noindex'
      - name: Container logs
        if: failure()
        run: docker logs sd || true
