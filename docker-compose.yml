# Steward Display with its database, for a church running it on its own server.
#
#   cp .env.example .env    # then set POSTGRES_PASSWORD
#   docker compose up -d
#
# Open http://localhost:3000. The setup page asks for a one-time code, printed
# by `docker compose logs app` on the line starting [setup].
# Put a TLS proxy in front before using it over the internet (docs/HOSTING.md).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: display
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: display
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U display -d display"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://display:${POSTGRES_PASSWORD}@db:5432/display
      TRUST_PROXY: ${TRUST_PROXY:-false}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      SETUP_CODE: ${SETUP_CODE:-}
    ports:
      # Behind a proxy on the same machine, set BIND_ADDRESS=127.0.0.1 so the
      # app is reachable only through it (Docker's published ports bypass ufw).
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-3000}:3000"

volumes:
  db-data:
